base_config:
- egs/tts/config_base.yaml
- egs/tts/megatts_dataset.yaml

# task
task_cls: tasks.tts.scriptspeech_task.ScriptSpeechSemanticLMTask

# data
frames_multiple: 8
dataset_cls: tasks.tts.dataset_utils.dialogue_dataset.DialogueSegmentShmDataset
val_dataset_cls: tasks.tts.dataset_utils.tts_datasets.DiTWavTextDataset

# dataloader
eval_max_batches: 0
ds_workers: 4
max_tokens: 16000   # 9000 * 0.04 = 360 sec (latent tokens = 2 * semantic tokens)
max_sentences: 200

# model
backbone_name: Qwen/Qwen3-0.6B
audio_tokenizer: glm4v
vae_stride: 4
lambda_text: 0

load_ckpt: ''
use_fsdp: false
gradient_checkpointing: false

# training
scheduler_lr_min: 4.0e-5

