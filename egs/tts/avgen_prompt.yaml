base_config:
- egs/tts/config_base.yaml
- egs/tts/datasets/promptaudio_dataset_va.yaml
- egs/tts/goku_text.yaml

# task
task_cls: tasks.tts.avgen_prompttask.ScriptSpeechDiTTask
dataset_cls: tasks.tts.dataset_utils.promptaudio_fastdataset_avgen.PromptAudioShmDataset
val_dataset_cls: tasks.tts.dataset_utils.tts_datasets.DiTWavTextDataset
dataloader_mp_type: fork
use_audio_dataset: False

# data
frames_multiple: 8
filter_relevant: True

# dataloader
eval_max_batches: 0
ds_workers: 4
max_tokens: 20000   # 24000 * 0.04 = 960 sec
max_sentences: 200
max_frames: 30000   # 5min
min_frames: 100
tgt_size_max: 6000  # 60 sec
tgt_size_min: 400   # 4 sec

# model
model_size: goku_2
latent_dim: 32
vae_stride: 4
vae_ckpt: checkpoints/1231_megatts3_wavvae_v3_25hz_kl001_fix4
audio_tokenizer: glm4v
load_sd_text_encoder: True

use_global: True
use_local: True
use_random_global: False

load_ckpt: ''
use_fsdp: false
gradient_checkpointing: false

# training
scheduler_lr_min: 4.0e-5
drop_st: True # drop semantic token
drop_xt: False # drop x_txt
dit_version: 2 # 1:normal 2:crass_att
drop_ref_wav: 1
trained_module: all # all, crossatt
add_vad_mask: True
drop_vad: False
use_qwen: True # flan t5 xxl不支持中文
