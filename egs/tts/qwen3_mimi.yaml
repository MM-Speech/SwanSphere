base_config:
- egs/tts/config_base.yaml
- egs/tts/megatts_dataset.yaml

# task
task_cls: tasks.tts.qwen_tts_task.Qwen3TTSMimiTask

# data
frames_multiple: 8
dataset_cls: tasks.tts.dataset_utils.megatts_fastdataset.CodecLMWavShmDataset
val_dataset_cls: tasks.tts.dataset_utils.tts_datasets.CodecLMWavDataset
processer_fn: tasks.tts.dataset_utils.megatts_fastdataset.processer_fn_codeclm_wav
build_fast_dataloader: tasks.tts.dataset_utils.megatts_fastdataset.build_fast_dataloader

# dataloader
eval_max_batches: 0
ds_workers: 8
max_tokens: 10000   # 10000 * 0.08 = 800 sec
max_sentences: 200
max_frames: 60000   # 10min
tgt_size_max: 6000  # 1min
tgt_size_min: 400   # 4 sec


# model
backbone_name: Qwen/Qwen3-0.6B
decoder_name: Qwen/Qwen3-0.6B
decoder_frame_ratio: 0.0625
decoder_proj_bias: true
acoustic_encoder_zero_init: true

lambda_text: 0.1
load_ckpt: ''
use_fsdp: false
gradient_checkpointing: false


model_debug: False
