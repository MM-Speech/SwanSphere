base_config:
  - ./config_base.yaml
  - ./megatts_dataset.yaml

task_cls: tasks.tts.ditar_task.DiTARTask

# dataset
dataset_cls: tasks.tts.dataset_utils.megatts_fastdataset.DiTWavTextShmDataset
val_dataset_cls: tasks.tts.dataset_utils.tts_datasets.DiTWavTextDataset
processer_fn: tasks.tts.dataset_utils.megatts_fastdataset.processer_fn_dit_wav_text
build_fast_dataloader: tasks.tts.dataset_utils.megatts_fastdataset.build_fast_dataloader
dataloader_mp_type: fork
prefetch_steps: 12

# dataloader
eval_max_batches: 0
ds_workers: 6
max_tokens: 10000   # 24000 * 0.04 = 960 sec
max_sentences: 200
max_frames: 30000   # 5min
min_frames: 300
tgt_size_min: 300
tgt_size_max: 12000
frames_multiple: 8

# data
add_vad_mask: False
valid_ph_dur: True

# model
vae_ckpt: checkpoints/1231_megatts3_wavvae_v3_25hz_kl001_fix4
latent_dim: 32
vae_stride: 4
use_caption_encoder: True
caption_encoder_name: Qwen/Qwen3-0.6B
caption_encoder_dim: 1024
ditar_decoder_use_caption: True
use_qk_norm: True
ditar_patch_size: 4
ditar_ctx_n_patches: 2
training_patch_keep_ratio: 0.6

stop_loss_start_step: 2000
lambda_stop_loss: 20.0
stop_loss_alpha: 0.99
stop_loss_gamma: 1.5

# optimizer
scheduler_lr_min: 4.0e-5

load_ckpt: ''
use_fsdp: false
gradient_checkpointing: false
disable_weight_decay_on_bias_and_norm_and_embed: True
ckpt_milestone_interval: 50000
tb_log_interval: 1

grad_norm_skip_threshold: 10
grad_norm_skip_warmup_steps: 10
