base_config:
- egs/tts/config_base.yaml
- egs/tts/megatts_dataset.yaml

# task
task_cls: tasks.tts.scriptspeech_task.ScriptSpeechDiTTask

# data
frames_multiple: 8
dataset_cls: tasks.tts.dataset_utils.megatts_fastdataset.DiTWavTextShmDataset
val_dataset_cls: tasks.tts.dataset_utils.tts_datasets.DiTWavTextDataset
processer_fn: tasks.tts.dataset_utils.megatts_fastdataset.processer_fn_dit_wav_text
build_fast_dataloader: tasks.tts.dataset_utils.megatts_fastdataset.build_fast_dataloader

# dataloader
eval_max_batches: 0
ds_workers: 4
max_tokens: 20000   # 24000 * 0.04 = 960 sec
max_sentences: 200
max_frames: 30000   # 5min
min_frames: 300
tgt_size_max: 6000  # 60 sec
tgt_size_min: 400   # 4 sec

# model
model_size: base
latent_dim: 32
vae_stride: 4
vae_ckpt: checkpoints/1231_megatts3_wavvae_v3_25hz_kl001_fix4
audio_tokenizer: glm4v
dit_text_inject_method: left-prefill

load_ckpt: ''
use_fsdp: false
gradient_checkpointing: false

# training
scheduler_lr_min: 4.0e-5
drop_st: False # drop semantic token
drop_xt: False # drop x_txt
dit_version: 1 # 1:normal 2:crass_att
drop_ref_wav: 0.0
add_vad_mask: False

