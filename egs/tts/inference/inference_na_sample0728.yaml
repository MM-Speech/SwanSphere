      - local_prompt: <W>我太开心了！我等这一天等了三年！<\W>He said with tears in his eyes, his voice trembled.<W>终于，我们毕业了！<\W>After saying that, he held up his degree cap.
        text: 我太开心了！我等这一天等了三年！终于，我们毕业了！
        global_prompt: In front of a university campus building, a young man in a graduation gown hugs friends and family.
      - local_prompt: <W>I can not believe you remembered!<\W>She smiled brightly and spoke with excitement.<W>Thank you so much, this means the world to me!<\W>Her voice trembled with joy.
        text: I can not believe you remembered! Thank you so much, this means the world to me!
