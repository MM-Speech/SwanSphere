      - local_prompt: <W>Wow! That is amazing!<\W>She gasped in awe.<W>Did you make this all by yourself?<\W>Her voice sparkled with excitement.
        text: Wow! That is amazing! Did you make this all by yourself?
        global_prompt: A cheerful girl looks at a huge snow sculpture in a winter wonderland scene.
      - local_prompt: <W>妈妈，我想你了……<\W>He choked up and said, tears slid down.<W>我一个人真的很孤单。<\W>He choked.
        text: 妈妈，我想你了……我一个人真的很孤单。
        global_prompt: A child sits alone in a dormitory bed, clutching a teddy bear in the dark.
      - local_prompt: <W>我真的好开心！<\W>She jumped excitedly while talking. <W>这简直是我人生中最棒的一天了！<\W>She raised her hands and shouted joyfully.
        text: 我真的好开心！这简直是我人生中最棒的一天了！
        global_prompt: In a sunny park, a cheerful young woman in a yellow dress speaks animatedly toward the camera.
      - local_prompt: <W>今天的演讲……是我人生中最重要的一次。<\W>He held back tears, voice low. <W>谢谢你们……一直支持我。<\W>His voice quivered with emotion.
        text: 今天的演讲……是我人生中最重要的一次。谢谢你们……一直支持我。
