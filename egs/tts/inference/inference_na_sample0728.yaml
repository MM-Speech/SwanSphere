      - local_prompt: <W>It is not fair. I did everything right.<\W>She clenched her jaw, voice tense and low.<W>Why does it always end like this?<\W>She looked away, holding back tears.
        text: It is not fair. I did everything right. Why does it always end like this?
        global_prompt: In a quiet library room, a young woman with long braids sits alone with her phone on the table.

  - group_name: style
    group:
      - local_prompt: <W>报告，前方发现异常情况。<\W>He speaks calmly and professionally.<W>请指示下一步行动。<\W>His tone is not fluctuating.
        text: 报告，前方发现异常情况。请指示下一步行动。
