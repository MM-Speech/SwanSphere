out_path: infer_out/tts
cfg_w: [5, 5, 5, 0]
extend_len: 0 # 往后延长
num_step: 100
vad_len: 0.2  # 前后silence的vad mask时长

samples:
  - group_name: gender
    group:
      - local_prompt: <W>喂，你好。现在说话方便吗？<\W>She said softly, holding her phone close.<W>我只是想问你昨天的事情……<\W>She spoke with hesitation and a hint of sadness.
        text: 喂，你好。现在说话方便吗？我只是想问你昨天的事情……
        global_prompt: In a dim-lit bedroom, a young woman sits on the bed with a phone pressed to her ear.
      - local_prompt: <W>我想请大家鼓掌欢迎我们的嘉宾。<\W>She spoke elegantly with a smile on her face.<W>请上台！<\W>Her tone is warm.
        text: 我想请大家鼓掌欢迎我们的嘉宾。请上台！
        global_prompt: A graceful woman in a cheongsam hosts a cultural event on stage.
      - local_prompt: <W>I can not believe you remembered...<\W>He said with a gentle smile.<W>Thank you, it means a lot.<\W>His voice softened.
        text: I can not believe you remembered... Thank you, it means a lot.
        global_prompt: A man receives a surprise birthday cake at midnight from his friends.
      - local_prompt: <W>我们走吧，别回头看。<\W>He said and grabbed her hand.<W>一切都会好的。<\W>His tone is firm.。
        text: 我们走吧，别回头看。一切都会好的。
        global_prompt: A young couple runs through a rainy street lit by dim neon lights.
      - local_prompt: <W>I knew you’d come back!<\W>She smiled through tears. <W>I waited for so long...<\W>Her voice broke softly.
        text: I knew you’d come back! I waited for so long...
        global_prompt: In the rain, a woman embraces her long-lost brother at the train station.


  - group_name: age
    group:
      - local_prompt: <W>妈妈，我今天考试考得很好！<\W>She said joyfully, jumping in place.<W>我拿到了第一名哦！<\W>She raised her voice excitedly, almost laughing.
        text: 妈妈，我今天考试考得很好！我拿到了第一名哦！
        global_prompt: In a brightly lit living room, a young girl with pigtails and a schoolbag still on speaks to her mother.
      - local_prompt: <W>嘿，老朋友，好久不见！<\W>He greeted warmly with a smile.<W>你最近过得怎么样啊？<\W>He said casually and relaxed.
        text: 嘿，老朋友，好久不见！你最近过得怎么样啊？
        global_prompt: At a cozy café on a rainy day, a man in his 80s with a stubbled chin and a cup of coffee waves across the room.
      - local_prompt: <W>你好，是我。<\W>He spoke softly into the phone.<W>我只是想听听你的声音。<\W>His voice quivered slightly.
        text: 你好，是我。我只是想听听你的声音。
        global_prompt: A middle-aged man leans against a window in a quiet apartment, holding a phone tightly.
      - local_prompt: <W>I can not believe this is happening...<\W>His voice trembled as he stared blankly. <W>Why me... Why now...<\W>He muttered to himself in a broken voice.
        text: I can not believe this is happening... Why me... Why now...
        global_prompt: A middle-aged man sits on a hospital bench alone, surrounded by silence.
      - local_prompt: <W>This is incredible… I never imagined I’d see something like this.<\W>He whispered, his voice filled with awe.<W>It is… beautiful.<\W>He exhaled slowly, overwhelmed.
        text: This is incredible… I never imagined I’d see something like this. It is… beautiful.
        global_prompt: In a vast natural canyon at sunset, an elderly man with a thick beard stands at the edge of a cliff.

  - group_name: scenario
    group:
      - local_prompt: <W>Hello, this is customer service. How can I help you today?<\W>She spoke with a polite and calm tone.<W>Please hold for a moment while I check the information.<\W>She continued while typing on the keyboard.
        text: Hello, this is customer service. How can I help you today? Please hold for a moment while I check the information.
        global_prompt: In a modern call center, a woman with a headset sits in front of a computer, surrounded by office noise.
      - local_prompt: <W>请大家注意，列车即将进站。<\W>He announced formally through a megaphone.<W>请站在黄线以外，谢谢合作。<\W>He said clearly and steadily.
        text: 请大家注意，列车即将进站。请站在黄线以外，谢谢合作。
        global_prompt: At a crowded subway station, a middle-aged station staff in uniform holds a megaphone.
      - local_prompt: <W>Hello? Is this thing on?<\W>He tapped the microphone.<W>Welcome everyone to our annual talent show!<\W>He announced energetically.
        text: Hello? Is this thing on? Welcome everyone to our annual talent show!
        global_prompt: A host in a sparkling suit stands on stage under bright lights in front of a large crowd.
      - local_prompt: <W>好了，孩子们都过来听我说！<\W>He announced loudly with a loudspeaker with an excited tone.<W>今天我们要进入神秘的洞穴！<\W>He looked at everyone with a smile.
        text: 好了，孩子们都过来听我说！今天我们要进入神秘的洞穴！
        global_prompt: At a summer camp near a forest, a middle-aged man with a wide-brimmed hat stands in front of a group of kids.
      - local_prompt: <W>Hey, I am in the subway. Can you hear me? The signal is bad.<\W>He spoke intermittently and his voice was a little noisy.<W>I will call you back in five.<\W>He hung up the phone quickly.
        text: Hey, I am in the subway. Can you hear me? The signal is bad. I will call you back in five.
        global_prompt: Inside a crowded subway train, a young man in business attire speaks into his phone, holding onto a handrail.

  - group_name: facial expression
    group:
      - local_prompt: <W>你听到了吗？他们说……我们赢了！<\W>He gasped, almost shouting. <W>我们真的赢了比赛！<\W>He said.
        text: 你听到了吗？他们说……我们赢了！我们真的赢了比赛！
        global_prompt: At a stadium tunnel, a young coach celebrates with teammates after a surprising victory.
      - local_prompt: <W>我……我不敢相信你会这么做……<\W>She covered her mouth, trembling. <W>你居然骗了我这么多年……<\W>Her voice cracked with disbelief.
        text: 我……我不敢相信你会这么做……你居然骗了我这么多年……
        global_prompt: In a dimly lit apartment, a woman in tears confronts her partner.
      - local_prompt: <W>This is amazing!<\W>She exclaimed. <W>I have never seen anything like this before!<\W>She clapped her hands as she spoke.
        text: This is amazing! I have never seen anything like this before!
        global_prompt: A tourist woman stands at the edge of a glowing blue cave, amazed by the natural beauty.
      - local_prompt: <W>我……我不知道该怎么办了。<\W>She said.<W>我真的尽力了，可是……还是失败了。<\W>She sat on the ground with her head in her arms.
        text: 我……我不知道该怎么办了。我真的尽力了，可是……还是失败了。
        global_prompt: Indoors under dim lighting, a girl in a school uniform is slumped and cry in a corner beside a desk.
      - local_prompt: <W>你有没有听到那是什么声音？<\W>She asked in a low voice.<W>我从来没听过这样的鸟叫。<\W>She looked at the woods in the distance.
        text: 你有没有听到那是什么声音？我从来没听过这样的鸟叫。
        global_prompt: In a rainforest during early morning mist, a girl in hiking gear pauses on the trail, looking into the trees excitedly.

  - group_name: race
    group:
      - local_prompt: <W>Oh, my God, this soup is too spicy!<\W>She chuckled and wiped her mouth.<W>But it is quite addictive!<\W>She added, fanning her mouth with her hand.
        text: Oh, my God, this soup is too spicy!But it is quite addictive!
        global_prompt: In a bustling Chinatown restaurant, a Chinese-American woman in her 40s laughs with friends as she tries a spicy hotpot for the first time.
      - local_prompt: <W>This traffic is wild, bro.<\W>He muttered while honking the horn.<W>We’re never getting to the party on time.<\W>He laughed, rolling his eyes.
        text: This traffic is wild, bro. We’re never getting to the party on time.
        global_prompt: In a car stuck in downtown Los Angeles traffic, a young African-American man with dreadlocks leans back in the driver is seat, phone on speaker.
      - local_prompt: <W>It is a pleasure to meet you, sir.<\W>He nodded politely.<W>Let me walk you through our proposal.<\W>He continued in a smooth, rehearsed tone.
        text: It is a pleasure to meet you, sir. Let me walk you through our proposal.
        global_prompt: In a corporate boardroom in London, a well-dressed South Asian man presents a business pitch with a calm and professional demeanor.
      - local_prompt: <W>嘿兄弟，这儿风景太棒了！<\W>He grinned, raising his phone for a selfie.<W>下次我们一定还得再来一次！<\W>He shouted over the wind.
        text: 嘿兄弟，这儿风景太棒了！下次我们一定还得再来一次！
        global_prompt: On a mountaintop trail in Colorado, a young Latino man with a hiking backpack captures the view while chatting with his friend.
      - local_prompt: <W>Do you know that my parents didn not let me learn to draw at the beginning?<\W>She whispered, eyes on her sketchpad.<W>But I still persisted.<\W>She said, tracing lines with a pencil.
        text: Do you know that my parents didn not let me learn to draw at the beginning?But I still persisted.
        global_prompt: In a quiet art studio in Seoul, a Korean teenager in a hoodie talks softly to her classmate while working on a drawing.

  - group_name: speed
    group:
      - local_prompt: <W>今天的重训有点难……<\W>He grunted intermittently between breaths.<W>但是不能放弃，加油！<\W>He spoke to himself with strain while lifting weights.
        text: 今天的重训有点难……但是不能放弃，加油！
        global_prompt: In a gym filled with equipment, a muscular man with sweat dripping from his forehead lifts a barbell.
      - local_prompt: <W>我……我没事。我真的没事。<\W>She stammered slowly and clearly tried to conceal it.<W>真的，我很好。<\W>She squeezed out a smile and her voice trembled.
        text: 我……我没事。。我真的没事。真的，我很好。
        global_prompt: A teenage girl stands in front of her classroom, pretending everything is fine.
      - local_prompt: <W>喂，等一下！你把这个忘了！<\W>He called out eagerly, hurrying after.<W>快拿好，不然你又得回来一趟。<\W>He was laughing while gasping for breath.
        text: 喂，等一下！你把这个忘了！快拿好，不然你又得回来一趟。
        global_prompt: In a sunny park, a man in his 30s with a ponytail and sportswear jogs toward a departing friend.
      - local_prompt: <W>啊！！！成功了！我做到了！<\W>He shouted excitedly and jumped up with his hands raised.<W>真的是我亲手完成的！<\W>He speaks fast and has a high voice.
        text: 啊！！！成功了！我做到了！真的是我亲手完成的！
        global_prompt: In a cluttered robotics lab, a teenager with curly hair and glasses celebrates next to a blinking prototype.
      - local_prompt: <W>Hey! Watch out!<\W>He shouted into a megaphone. <W>The water is rising too fast!<\W>He spoke quickly, panic in his voice.
        text: Hey! Watch out! The water is rising too fast!
        global_prompt: A rescue team leader stands in a flooded street, directing people through a megaphone.

  - group_name: pitch
    group:
      - local_prompt: <W>这是我们的新产品！<\W>She announced with great energy and gestures.<W>它能帮助你提高生活效率！<\W>She emphasized while holding up the object.
        text: 这是我们的新产品！它能帮助你提高生活效率！
        global_prompt: In a tech expo, a confident woman in formal attire stands on a stage with LED lights behind her.
      - local_prompt: <W>你怎么能这么做？<\W>She roared with a trembling and sharp voice.<W>我再也不想见到你了！<\W>She was almost screaming.
        text: 你怎么能这么做？我再也不想见到你了！
        global_prompt: A young woman stands in a dimly lit kitchen, fists clenched and eyes red with anger.
      - local_prompt: <W>I am not sure about this…<\W>He muttered nervously, scratching his head.<W>Are you sure it is safe?<\W>His tone was full of doubt.
        text: I am not sure about this… Are you sure it is safe?
        global_prompt: A young man stands at the edge of a cliff with a bungee cord strapped on.
      - local_prompt: <W>That is the spirit!<\W>He cheered while clapping.<W>Keep going, you are doing amazing!<\W>He encouraged warmly.
        text: That is the spirit! Keep going, you are doing amazing!
        global_prompt: A coach motivates his athletes on a field during early morning training.
      - local_prompt: <W>This is not over yet!<\W>He shouted defiantly.<W>I will keep fighting until the end!<\W>He growled with determination.
        text: This is not over yet! I will keep fighting until the end!
        global_prompt: A warrior with bloodied armor stands tall in a battlefield filled with smoke.

  - group_name: volume
    group:
      - local_prompt: <W>等一下，我听到了什么声音。<\W>He whispered nervously, almost holding his breath.<W>你有没有听到？就在那边！<\W>He spoke in a low, shaky voice while pointing.
        text: 等一下，我听到了什么声音。你有没有听到？就在那边！
        global_prompt: In a dim forest at night, a teenage boy in a hoodie hides behind a tree.
      - local_prompt: <W>This is heavy... real heavy.<\W>He grunted while lifting a large box.<W>Alright, I got it. Do not drop it!<\W>He strained his voice.
        text: This is heavy... real heavy. Alright, I got it. Do not drop it!
        global_prompt: A muscular man carries a large crate up the stairs in a warehouse.
      - local_prompt: <W>你听见了吗？外面好像有动静。<\W>She lowered her voice and said in horror.<W>快关灯，别出声。<\W>She commanded nervously.
        text: 你听见了吗？外面好像有动静。快关灯，别出声。
        global_prompt: A couple hides inside their house during a blackout, peering through the blinds.
      - local_prompt: <W>Stop! That is dangerous!<\W>She yelled, waving her hands.<W>Move away from the edge now!<\W>Her voice was panicked.
        text: Stop! That is dangerous! Move away from the edge now!
        global_prompt: A lifeguard shouts at a child near a seaside cliff.
      - local_prompt: <W>嗯？谁在那边？<\W>He whispered cautiously. <W>别动！我看到你了！<\W>His voice was low and sharp.
        text: 嗯？谁在那边？别动！我看到你了！
        global_prompt: A guard patrols a dark alley, flashlight shaking slightly in hand.

  - group_name: emotion
    group:
      - local_prompt: <W>This... this is amazing!<\W>He gasped and stepped back in awe.<W>I have never seen anything like this before!<\W>He spoke with breathless excitement.
        text: This... this is amazing! I have never seen anything like this before!
        global_prompt: Inside a futuristic lab, a young male scientist in a white coat stares at a glowing orb.
      - local_prompt: <W>你知道吗？我真的很难过。<\W>She said in a broken voice, holding back tears.<W>昨天我失去了最好的朋友。<\W>She whispered, her voice trembling.
        text: 你知道吗？我真的很难过。昨天我失去了最好的朋友。
        global_prompt: A teenage girl sits alone on a park bench under a gloomy sky, wiping her eyes with a tissue.
      - local_prompt: <W>We did it! We actually did it!<\W>He shouted with joy, jumping up and down.<W>Unbelievable! This is the best day of my life!<\W>He laughed uncontrollably.
        text: We did it! We actually did it! Unbelievable! This is the best day of my life!
