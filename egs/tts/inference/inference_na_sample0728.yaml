      - local_prompt: <W>我们一定能坚持下去！<\W>He shouted with passion and clenched his fist.<W>没有什么可以阻挡我们的决心！<\W>He continued loudly, full of determination.
        text: 我们一定能坚持下去！没有什么可以阻挡我们的决心！
