base_config:
  - ./config_base.yaml
  - ./datasets/prompttts_dataset.yaml

task_cls: tasks.tts.promptaudio_post_task.PromptAudioTask

# dataset
dataset_cls: tasks.tts.dataset_utils.promptaudio_shmdataset.PromptAudioShmDataset
val_dataset_cls: tasks.tts.dataset_utils.tts_datasets.DiTWavTextDataset
dataloader_mp_type: fork
fast_dataloader_version: v2

# dataloader
eval_max_batches: 0
ds_workers: 6
max_tokens: 10000   # 24000 * 0.04 = 960 sec
max_sentences: 200
max_frames: 30000   # 5min
min_frames: 300
frames_multiple: 8

# data
add_vad_mask: True
use_vocal: True

# model
vae_ckpt: checkpoints/1231_megatts3_wavvae_v3_25hz_kl001_fix4
latent_dim: 32
vae_stride: 4
use_caption_encoder: True
use_caption_text_mark: True
caption_encoder_name: Qwen/Qwen3-0.6B
caption_encoder_dim: 1024
model_size: goku_2
caption_crossattn_n_layers: 32
use_qk_norm: True
use_ema: True
ema_decay: 0.9995
reset_cross_attn: False

# cfg
lat_cfg_prob: 0.15
txt_cfg_prob: 0.15
caption_cfg_prob: 0.15
ph_cfg_prob: 0.2

# sparse dur
use_sparse_dur: False
sparse_dur_mode: proportional
sparse_dur_frames: 4
sparse_dur_alpha: 0.2
sparse_dur_min_keep: 1
sparse_dur_keep_ratio:
sparse_dur_symmetric: True

# optimizer
scheduler_lr_min: 4.0e-5

load_ckpt: ''
use_fsdp: true
gradient_checkpointing: false
grad_norm_skip_threshold: 10.0
grad_norm_skip_warmup_steps: 10

audio_mask_loss_weight: 2.0

dit_version: 'audio'

meta_paths: [
            '/mnt/bn/genai-data2/renyi/entries/interns_env/leike/data/metadata/vdataset_1spk.filter.json',
            '/mnt/bn/genai-data2/renyi/entries/interns_env/leike/data/metadata/vdataset_audio.filter.json',
            '/mnt/bn/genai-data2/renyi/entries/interns_env/leike/data/metadata/hq_9m_1spk.filter.json',
            '/mnt/bn/genai-data2/renyi/entries/interns_env/leike/data/metadata/hq_9m_audio.filter.json'
            ]
