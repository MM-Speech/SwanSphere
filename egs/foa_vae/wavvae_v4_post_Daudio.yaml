base_config:
  - egs/foa_vae/wavvae_v4_post.yaml

task_cls: tasks.foa_vae.wavvae_v4_post_daudio_task.FOAWavVAEV4PostDAudioTask

# Continue from the complete V4-post state. The D_audio module and its third
# optimizer do not exist in this checkpoint and therefore start from scratch.
resume_from: checkpoints/260806_foa_vaev4_post
resume_from_checkpoint: 1000002
max_updates: 1200000

# These stages are relative to daudio_start_step, not to step zero of V4.
daudio_start_step: 1000002
daudio_pretrain_steps: 10000
daudio_gan_ramp_steps: 10000

foa_daudio:
  gain: 1.0
  direction_probabilities:
    x: 0.2
    y: 0.2
    z: 0.2
    random: 0.4
  w_loss_weight: 0.5
  projection_loss_weight: 0.5

losses:
  lambda_proj_mrstft: 1.0
  lambda_intensity_dir: 0.6
  lambda_cross_phase: 0.3
  lambda_cov: 0.6
  lambda_daudio_dis: 1.0
  lambda_daudio_adv: 0.02
  lambda_daudio_feature_matching: 10.0
