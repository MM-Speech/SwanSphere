base_config:
  - egs/tts/config_base.yaml
  - egs/foa_vae/datasets/mixed_foa_dataset.yaml

task_cls: tasks.foa_vae.wavvae_v3_task.FOAWavVAEV3Task

dataset_cls: tasks.foa_vae.dataset_utils.pyroom_dataset.FOAVAEV1Dataset
val_dataset_cls: tasks.foa_vae.dataset_utils.pyroom_dataset.FOAVAEV1Dataset
dataloader_mp_type: fork
dataloader_version: v2

ds_workers: 8
max_sentences: 20
tgt_size_min: 20
tgt_size_max: 200
frames_multiple: 8
vae_stride: 4
dynamic_batch: true
max_tokens: 300
fast_ds_shuffle_buffer: 4

use_fsdp: false
load_ckpt: ''
load_ckpt_strict: false
use_ema: true
ema_decay: 0.9999
ema_update_after_step: 1
ema_use_warmup: true
ema_power: 0.75
val_check_interval: 2000
eval_max_batches: 0
val_batch_size: 0
ckpt_milestone_interval: 10000
max_updates: 1000000

sample_rate: 44100
audio_sample_rate: 44100
sample_size: 65536
foa_target_seconds: 1.486077097505669
foa_random_crop: true
from_scratch: false

lr: 1.0e-5
disc_lr: 1.0e-5
adam_b1: 0.8
adam_b2: 0.99
weight_decay: 0.0
disc_weight_decay: 0.0
warmup_updates: 2000
accumulate_grad_batches: 4
generator_grad_norm: 1.0
discriminator_grad_norm: 1.0
grad_norm_skip_threshold: 50000.0
grad_norm_skip_init_threshold: 50000.0

d_pretrain_steps: 10000
gan_ramp_steps: 20000

foa_vae:
  pretrained_model_dir: checkpoints/vae
  input_channels: 4
  output_channels: 4
  latent_channels: 64
  downsampling_ratios: [2, 2, 4, 8, 8]

losses:
  lambda_mrstft: 1.0
  lambda_high_frequency_excess_db: 0.01
  lambda_kl: 1.0e-5
  lambda_mel_multiband: 0.0
  lambda_adv: 0.05
  lambda_feature_matching: 5.0
  lambda_dis: 1.0

loss_configs:
  high_frequency_excess_db:
    min_frequency_hz: 6000.0
    margin_db: 1.0
    fft_size: 2048
    hop_size: 512
    win_length: 2048
    min_db: -80.0
  mel_multiband:
    band_edges_hz: [0, 1000, 6000, 20000]
    band_weights: [1.0, 1.0, 1.0]
    resolutions:
      - {fft_size: 512, hop_size: 128, win_size: 512, audio_num_mel_bins: 80, fmin: 0, fmax: 20000}
      - {fft_size: 1024, hop_size: 256, win_size: 1024, audio_num_mel_bins: 128, fmin: 0, fmax: 20000}
      - {fft_size: 2048, hop_size: 512, win_size: 2048, audio_num_mel_bins: 160, fmin: 0, fmax: 20000}
  spectral:
    config:
      fft_sizes: [2048, 1024, 512, 256, 128, 64, 32]
      hop_sizes: [512, 256, 128, 64, 32, 16, 8]
      win_lengths: [2048, 1024, 512, 256, 128, 64, 32]
      perceptual_weighting: true
  discriminator:
    type: encodec
    config:
      filters: 32
      n_ffts: [2048, 1024, 512, 256, 128]
      hop_lengths: [512, 256, 128, 64, 32]
      win_lengths: [2048, 1024, 512, 256, 128]
