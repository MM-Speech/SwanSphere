base_config:
  - egs/foa_vae/wavvae_v1_base.yaml

task_cls: tasks.foa_vae.wavvae_v1_s2_task.FOAWavVAEStage2Task
max_updates: 80000
max_tokens: 150

foa_target_seconds: 4.0

foa_stage:
  trainable: full
  train_d: false
  use_g_adv: false
  lr:
    adapter: 2.0e-5
    backbone: 2.0e-5
    disc: 0.0

foa_lr_scheduler:
  enabled: true
  lr_max: 2.0e-5
  lr_min: 5.0e-6
  warmup_updates: 0
  initial_period: 5000
  period_mult: 1.0

foa_losses:
  __replace: true
  lambda_ch_mrstft: 0.5
  lambda_proj_mrstft: 1.0
  lambda_proj_l1: 0.0
  lambda_time_l1: 0.0
  lambda_intensity_dir:
    start: 0
    duration: 50000
    start_value: 1.0
    end_value: 2.0
  lambda_cross_phase:
    start: 0
    duration: 50000
    start_value: 0.50
    end_value: 1.0
  lambda_cov:
    start: 0
    duration: 50000
    start_value: 1.0
    end_value: 2.0
  lambda_kl: 3.0e-5
  # lambda_kl:
  #   start: 0
  #   duration: 50000
  #   start_value: 1.0e-5
  #   end_value: 3.0e-5
  lambda_adv: 0.0
  lambda_fm: 0.0
  lambda_dis: 0.0
  lambda_stereo_adv: 0.0
  lambda_stereo_fm: 0.0
  lambda_stereo_dis: 0.0
