base_config:
  - egs/tts/config_base.yaml
  - egs/foa_vae/datasets/mixed_foa_dataset.yaml

dataset_cls: tasks.foa_vae.dataset_utils.pyroom_dataset.FOAVAEV1Dataset
val_dataset_cls: tasks.foa_vae.dataset_utils.pyroom_dataset.FOAVAEV1Dataset
dataloader_mp_type: fork

ds_workers: 8
max_sentences: 20
tgt_size_min: 20
tgt_size_max: 200
frames_multiple: 8
vae_stride: 4
dynamic_batch: true
max_tokens: 150
fast_ds_shuffle_buffer: 4

task_cls: ''
use_fsdp: false
load_ckpt: ''
load_ckpt_strict: false
use_ema: false
val_check_interval: 2000
eval_max_batches: 0
val_batch_size: 0
ckpt_milestone_interval: 10000
max_updates: 1000000

sample_rate: 44100
audio_sample_rate: 44100
from_scratch: false

lr: 5.0e-5
disc_lr: 1.0e-5
adam_b1: 0.8
adam_b2: 0.99
weight_decay: 0.0
disc_weight_decay: 0.0
generator_grad_norm: 1.0
discriminator_grad_norm: 1.0
accumulate_grad_batches: 4
warmup_updates: 0
grad_norm_skip_threshold: 50000.0
grad_norm_skip_init_threshold: 50000.0

foa_vae:
  pretrained_model_dir: checkpoints/vae
  input_channels: 4
  output_channels: 4
  latent_channels: 128
  init_strategy: repeat  # repeat | zero_extra
  zero_extra_weight_g_scale: 0.05

foa_projection:
  gain: 1.0
  include_axes: true
  include_corners: false
  random_dirs: 0
  mrstft_chunk_size: 2

foa_stereo_projection:
  enabled: false
  gain: 1.0
  pairs:
    - name: front_back
      left: [1.0, 0.0, 0.0]
      right: [-1.0, 0.0, 0.0]
    - name: left_right
      left: [0.0, 1.0, 0.0]
      right: [0.0, -1.0, 0.0]
    - name: up_down
      left: [0.0, 0.0, 1.0]
      right: [0.0, 0.0, -1.0]

foa_spatial_loss:
  fft_size: 1024
  hop_size: 256
  win_length: 1024
  energy_percentile: 0.5

foa_stage:
  trainable: full
  train_d: false
  use_g_adv: false
  d_update_every: 1
  lr:
    adapter: 5.0e-5
    backbone: 5.0e-6
    disc: 1.0e-5

foa_losses:
  lambda_ch_mrstft: 0.0
  lambda_channel_mrstft: 0.0
  channel_mrstft_weights: [1.0, 1.0, 1.0, 1.0]
  lambda_proj_mrstft: 0.0
  lambda_proj_l1: 0.0
  lambda_time_l1: 0.0
  lambda_intensity_dir: 0.0
  lambda_cross_phase: 0.0
  lambda_cov: 0.0
  lambda_kl: 0.0
  lambda_adv: 0.0
  lambda_fm: 0.0
  lambda_dis: 0.0
  lambda_stereo_adv: 0.0
  lambda_stereo_fm: 0.0
  lambda_stereo_dis: 0.0

loss_configs:
  spectral:
    config:
      fft_sizes: [2048, 1024, 512, 256, 128, 64, 32]
      hop_sizes: [512, 256, 128, 64, 32, 16, 8]
      win_lengths: [2048, 1024, 512, 256, 128, 64, 32]
      perceptual_weighting: true
  discriminator:
    config:
      filters: 192
      n_ffts: [2048, 1024, 512, 256, 128]
      hop_lengths: [512, 256, 128, 64, 32]
      win_lengths: [2048, 1024, 512, 256, 128]
