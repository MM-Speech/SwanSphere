  - caption: "Subjects: No subjects. Narration: The overall environment sound is the faint, ambient chirping of night insects <Audio>faint chirping of night insects</Audio> and the gentle lapping of water <Audio>gentle lapping of water</Audio>. A green frog sits on a lotus leaf. Its throat pouch visibly inflates and deflates as it lets out a series of deep, rhythmic croaks <Audio>rhythmic frog croaking</Audio>. With each croak, tiny ripples spread across the dark water surface around the lotus leaf."
  - caption: "Subjects: Subject1: A motorcyclist of unspecified gender and age, wearing a full-face helmet that obscures their features, clad in a protective black leather jacket and gloves. Narration: The overall environment sound is a blend of rushing wind and the faint sound of tires on asphalt. A motorcyclist speeds along the deserted coastal highway. The tracking camera keeps pace with the motorcycle, maintaining a close-up view. The motorcycle's powerful engine lets out a deep, powerful roar <Audio>deep, powerful engine roar</Audio> that reverberates through the open air, dominating the soundscape."
  - caption: "Subjects: No subjects. Narration: The overall environment sound is a mix of city traffic and the powerful sounds of the emergency vehicle. An ambulance races urgently down the city street. <Audio>A sharp, urgent, and approaching ambulance siren wails (wee-woo, wee-woo)</Audio>. Its powerful engine roars and its tires hiss on the wet pavement as it weaves through other cars <Audio>sound of a heavy vehicle engine and tires on a wet road</Audio>. The ambulance speeds past the camera, the siren sound peaking in volume before starting to recede into the distance."
  - caption: "Subjects: No subjects. Narration: The overall environment sound is a mix of mechanical noises and steam. An old-fashioned steam train moves steadily along the railway tracks. Its massive wheels turn, creating a powerful and rhythmic clanking sound as they make contact with the rails <Audio>rhythmic 'clank, clank, clank' of wheels on track</Audio>. At the same time, the engine releases billows of steam with a distinct and continuous hissing noise <Audio>hissing of steam</Audio>."
  - caption: "Subjects: Subject1: A female pianist, East Asian, around 25-35 years old, with her long dark hair elegantly styled. She is wearing a black evening gown. Narration: The only sound is the beautiful piano music. The camera holds a tight focus on the pianist's hands. Her slender fingers move gracefully and with precision across the keyboard, elegantly pressing the black and white keys. As her hands dance over the piano, a stream of crisp, melodious notes flows out, forming a beautiful and elegant melody <Audio>sound of an elegant and flowing piano melody</Audio>."
  - caption: "Subjects: Subject1: A male musician, around 30-40 years old, with neat black hair. He is wearing a formal black tuxedo with a white dress shirt and a black bow tie. His voice is not heard. Narration: The scene is filled with the sound of a violin playing a long, emotional, and high-pitched melody. The male musician stands completely absorbed in his performance, his eyes closed. He gracefully and passionately draws the bow across the violin strings, causing them to vibrate and produce the beautiful, soaring music. His body sways slightly with the rhythm of the piece."
  - caption: "Subjects: Subject1: A female drummer, East Asian, in her mid-20s, with long dark hair tied back, wearing a black band t-shirt and ripped jeans. She is positioned center stage behind a drum kit, her expression one of intense focus. Narration: The predominant sound is the raw, amplified power of the drum kit. The female drummer plays with speed and force, her arms a blur of motion. She begins by powerfully striking a drum, producing a deep, resonant boom <Audio>powerful drum hit</Audio>, and immediately follows with a crisp, explosive strike on a cymbal <Audio>sharp cymbal crash</Audio>. She then delivers a quick, forceful double hit on the drums <Audio>rapid double drum beat</Audio>, followed by another resounding <Audio>sharp cymbal crash</Audio>, creating a driving, powerful, and rhythmic beat."
  - caption: "Subjects: No subjects. Narration: The overall environment sound is the constant roar of agitated ocean waves <Audio>sound of crashing waves</Audio> and the escalating wind of an approaching storm. The scene is dark and moody. Suddenly, a massive, brilliant fork of lightning splits the dark sky, momentarily illuminating the entire scene in a stark, bright flash. After a few seconds of tense silence, a deep, rumbling clap of thunder echoes across the landscape <Audio>a deep, rumbling and powerful clap of thunder</Audio>. Immediately following the thunder, a torrential downpour begins, with heavy rain falling in sheets <Audio>sound of a heavy downpour</Audio>."
  - caption: "Subjects: No subjects. Narration: The overall environment is filled with the continuous, deafening roar of the waterfall. An immense volume of water pours relentlessly over the edge of a high cliff, falling in a powerful, unbroken stream. It crashes violently into the pool below, generating enormous plumes of white spray and a swirling mist that rises into the air <Audio>continuous, loud roaring and crashing sound of water</Audio>. The water in the pool churns and eddies from the constant force of the cascade."
  - caption: "Subjects: No subjects. Narration: The overall environment sound is the gentle chirping of night insects. A large bonfire burns brightly in the darkness. Flames of vibrant orange and red leap and dance upwards, sending glowing embers into the night air. The firewood within the blaze shifts and settles, periodically emitting a sharp, crackling and popping sound <Audio>sound of wood crackling and popping</Audio>, creating a warm and cozy atmosphere."
  - caption: "Subjects: No subjects. Narration: The scene begins with the sound of liquid being poured <Audio>sound of pouring liquid</Audio>. A stream of dark brown, ice-cold Coca-Cola flows from the bottle into the glass, weaving its way between the ice cubes. As the cola fills the glass, it erupts in a cascade of bubbles, creating a vigorous fizz <Audio>hissing and bubbling sounds</Audio>. The ice cubes shift and jostle from the force of the pour, bumping against each other and the sides of the glass, creating a series of sharp, crisp clinking noises <Audio>clinking sound of ice cubes</Audio>. The foam rises briefly before settling, revealing the bubbly, dark liquid mingling with the glistening ice."
  - caption: "Subjects: Subject1: A young man on the far side of the court, in his early 20s, with short black hair, wearing a white sports polo shirt and blue shorts. Subject2: A young woman on the near side of the court, in her early 20s, with her brown hair tied in a ponytail, wearing a yellow sleeveless tennis dress and white sneakers. Narration: The overall environment sound is a quiet outdoor ambiance mixed with the sounds of the game. A young man and a young woman are engaged in a focused tennis rally. The woman, on the near side, hits the ball with a powerful forehand <Audio>sound of tennis ball being hit</Audio>. The ball flies swiftly over the net. The man, on the far side, quickly repositions himself <Audio>sound of sneakers squeaking on the court</Audio> and returns the shot with a clean backhand <Audio>sound of tennis ball being hit</Audio>. The ball travels back and forth across the court as they continuously trade shots, their movements fluid and athletic. The rhythmic 'thwack, thwack' of the ball hitting the rackets defines the scene's audio landscape <Audio>sound of tennis ball being hit</Audio><Audio>sound of tennis ball being hit</Audio>."
  - caption: "Subjects: Subject1: A person whose hand and forearm are visible in a close-up, wearing a long-sleeved, elegant party outfit. Subject2: A group of people in the background, men and women of various ages, dressed in festive attire for a celebration. Their voices are a mix of excited tones contributing to the cheering. Narration: The overall environment sound is upbeat party music mixed with the low hum of crowd chatter. A hand forcefully twists and pulls the cork from a champagne bottle. The cork suddenly shoots out with a loud bang <Audio>loud pop of a champagne cork</Audio>. Immediately following the pop, a torrent of white, bubbly foam erupts and overflows from the mouth of the bottle <Audio>sound of fizzing and spraying foam</Audio>. As the foam gushes out, the surrounding party guests erupt in loud, joyous cheers and applause <Audio>cheers and shouts of excitement from the crowd</Audio>."
  - caption: "Subjects: Subject1: An Asian male boxer, around 25-35 years old, with a muscular and athletic build. He is wearing red boxing gloves, black athletic shorts, and a grey tank top, with a focused and determined expression on his face. Narration: The overall environment sound is a low hum of gym ambiance. The boxer stands before the heavy punching bag and begins to deliver a continuous series of powerful strikes. Each punch lands with a deep, dull thud <Audio>heavy thudding sounds of punches landing</Audio>, causing the heavy bag to swing back and forth violently. The chains supporting the bag rattle with the movement <Audio>sound of chains rattling</Audio>. The boxer lets out occasional grunts of effort with his powerful punches <Audio>grunts of exertion</Audio>."
  - caption: "Subjects: Subject1: A young man, around 18-22 years old, Caucasian, with messy blond hair peeking out from under a black beanie, wearing a loose-fitting grey hoodie, black jeans, and skate shoes. Vocal timbre is not applicable as there is no speech. Narration: The overall environment sound is the low hum of city life mixed with the faint sound of distant traffic. Subject1, the skateboarder, approaches the metal rail at high speed, his wheels making a rumbling sound on the concrete <Audio>sound of skateboard wheels rolling on pavement</Audio>. As he gets close, he performs an ollie, with the tail of his board making a sharp pop against the ground <Audio>sharp 'pop' sound of the skateboard tail hitting the ground</Audio>. The board lifts into the air, and he lands with the trucks on the metal rail, beginning a long grind. The board sliding against the metal produces a loud, piercing screeching sound <Audio>a long, harsh metallic grinding sound</Audio>. He maintains his balance along the length of the rail before popping off the end and landing smoothly back on the pavement <Audio>sound of skateboard landing on concrete</Audio>."
  - caption: "Subjects: Subject1: A male professional table tennis player on the near side of the table, around 20-25 years old, Asian, with short black hair, wearing a red and black short-sleeved sports shirt and matching shorts. Subject2: A male professional table tennis player on the far side of the table, around 20-25 years old, Asian, with short black hair, wearing a blue short-sleeved sports shirt and matching shorts. Narration: The ambient sound is the faint echo of the hall, punctuated by the sharp squeaks of athletic shoes on the floor <Audio>sound of shoes squeaking on the floor</Audio>. A small white ping pong ball bounces back and forth at high speed across the table between the two players. Their paddles move in a blur, creating a crisp and rhythmic back-and-forth hitting sound <Audio>crisp, rhythmic sound of the ball being hit back and forth</Audio>. Suddenly, Subject1 on the near side prepares and executes a powerful smash, his body twisting as he swings the paddle with maximum force <Audio>loud sound of a powerful smash</Audio>. The ball transforms into a white streak, flying past Subject2, who lunges but fails to make contact. The ball shoots off the table."
  - caption: "Subjects: Subject1: A young man in his early 20s, with an athletic build and short black hair, wearing a red basketball jersey and black shorts. Narration: The overall environment sound is the faint ambiance of a quiet outdoor space. A young man is in the middle of the court, energetically dribbling a basketball. The camera follows him as he moves across the court. He dribbles the ball hard against the ground, causing it to bounce up high with a powerful and rhythmic beat <Audio>forceful, rhythmic sound of a basketball dribbling</Audio>, which echoes across the empty court. His sneakers make sharp sounds as he shifts his feet on the pavement <Audio>squeak of sneakers</Audio>."
  - caption: "Subjects: No subjects. Narration: The scene begins with a faint, quiet room ambiance. The smartphone lies inactive on the table. Suddenly, its screen illuminates brightly, and it begins to vibrate while a crisp, default ringtone starts to play <Audio>phone vibrating and ringing</Audio>. After a few seconds, a hand enters the frame from the right, reaching for the phone. A finger touches the screen and performs a swiping gesture to answer the call <Audio>sound of a finger swiping on a screen followed by a soft click</Audio>. The ringtone and vibration cease abruptly as the call is connected."
  - caption: "Subjects: No subjects. Narration: The scene begins in complete darkness and silence. A hand holding a metal lighter appears. The thumb flicks open the lighter's cap, producing a sharp sound <Audio>crisp metallic click of a lighter cap opening</Audio>. Immediately following this, the thumb spins the flint wheel <Audio>sound of a flint wheel striking</Audio>, and a small cluster of flames ignites, casting a bright, flickering light in the darkness."
  - caption: "Subjects: Subject1: A Chinese man, around 40-50 years old, a market stall owner. He has a friendly, weathered face and is wearing a simple t-shirt and an apron. His voice is loud, resonant, and has a strong local accent, amplified by a megaphone. Narration: The overall environment sound is the chaotic din of a busy market, with the murmur of crowds and distant calls from other vendors. Subject1 stands at his stall, lifts a large megaphone to his mouth, and shouts loudly, his voice echoing through the market: <S1>新鲜的蔬菜，便宜卖啦！</S1> The sound is amplified and carries his distinct local accent."
  - caption: "Subjects: No subjects. Narration: The overall environment sound is the faint, cold sound of wind and the gentle lapping of water against the ice shelf. On the edge of the massive glacier, a visible crack begins to form and rapidly widens. This is accompanied by a loud, crisp, and deep cracking sound <Audio>a loud, deep cracking sound</Audio>. A massive chunk of the glacier, forming a new iceberg, shears off and dramatically falls away from the main ice shelf. It plummets into the sea below, creating a colossal splash and a deep rumbling sound as it hits the water <Audio>massive splash and deep rumbling sound</Audio>, sending waves rippling outwards."
  - caption: "Subjects: Subject1: A woman, around 30 years old, with long dark hair, wearing a stylish beige trench coat, a white top, and blue jeans. Narration: The overall environment sound is the low hum of distant traffic. Subject1 exits the sedan and steps onto the pavement. She then turns back and forcefully slams the car door shut, which closes with a heavy, solid thud <Audio>heavy car door slam</Audio>. Immediately afterward, the car's electronic lock engages with two distinct, sharp beeps <Audio>electronic car lock beeps</Audio>. She pauses for a second beside the now-secured vehicle."
  - caption: "Subjects: No subjects. Narration: The overall environment sound is a low, subtle electronic hum mixed with a faint echo. A bipedal humanoid robot walks at a steady pace through the futuristic corridor. With each step, its complex mechanical joints and heavy metal feet make a distinct, rhythmic sound against the floor, conveying a sense of weight and precision <Audio>heavy and precise mechanical clanking sound</Audio>. This sound repeats with every step as the robot moves forward."
  - caption: "Subjects: Subject1: A shirtless blacksmith, a rugged man around 40-50 years old, with a muscular and sweaty upper body, wearing dark, heavy-duty work trousers. Narration: The overall environment sound is the low roar and crackle of the forge fire. The shirtless blacksmith uses a pair of iron tongs to hold a glowing, red-hot piece of iron firmly on the anvil. He then raises a large sledgehammer high above his head and brings it down with great force, striking the iron. Each powerful blow produces a loud, clear clang <Audio>loud, clear clang of a hammer striking hot metal</Audio>, sending a brilliant shower of orange sparks flying into the air. He continues to hammer the iron rhythmically, the resounding <Audio>clang, clang</Audio> echoing through the workshop with each strike."
  - caption: "Subjects: Subject1: A professional chef, appearing to be an Asian man around 30-40 years old, with short black hair and a focused expression, positioned behind a cutting board. He is wearing a clean, white chef's uniform. His vocal timbre is not applicable as he does not speak in the scene. Narration: The overall environment sound is a faint background kitchen ambiance. The chef's hands are in motion, skillfully guiding a large Chinese cleaver. He begins to rapidly chop a cucumber on the wooden board with precise, swift, and rhythmic downward strokes. The blade contacts the board, producing a continuous and rhythmic series of crisp chopping sounds <Audio>rhythmic, crisp sound of a cleaver chopping on a wooden board</Audio>. The cucumber is quickly transformed into thin, even slices."
  - caption: "Subjects: No subjects. Narration: The overall environment sound is the gentle crackle of hot oil. An egg is cracked and dropped into the pan <Audio>sound of egg cracking and plopping into oil</Audio>. The instant the egg white hits the hot oil, it erupts into a loud, enticing sizzle <Audio>aggressive sizzling and frying sounds</Audio>. The translucent egg white immediately turns opaque and bubbles vigorously, with its edges becoming crispy and golden-brown. The bright yellow yolk stays in the center, its surface trembling slightly amidst the bubbling oil."
  - caption: "Subjects: No subjects. Narration: The overall environment is silent, focusing all auditory attention on the action. A pair of hands firmly grips a dark chocolate bar horizontally. The hands apply increasing pressure, bending the bar until it suddenly snaps cleanly into two perfect halves, producing a very crisp and satisfying snapping sound <Audio>crisp, clean snapping sound of chocolate breaking</Audio>. The hands hold the two separated pieces for a brief moment."
  - caption: "Subjects: No subjects. Narration: The overall environment sound is the gentle rustling of leaves in the wind. A person is walking through the forest. The camera tracks a pair of brown leather boots as they step firmly onto the thick layer of dry leaves. With each step, the boots press down, creating a crisp and satisfying crunching sound <Audio>crisp crunching sound of dry leaves breaking</Audio>. The person continues walking, and with every step, the same pleasant crackling sound is heard <Audio>crisp crunching sound of dry leaves breaking</Audio>."
  - caption: "Subjects: No subjects. Narration: The overall environment sound is the intense roar of a powerful hailstorm. A sudden storm begins as dense, bean-sized hailstones plummet from the sky. They bombard the metal roof of the car, creating a loud, chaotic, and rapid tapping percussion <Audio>intense, rapid tapping sounds of hailstones hitting metal</Audio>. The hailstones are seen bouncing off the car's surface upon impact as the storm continues to rage."
  - caption: "Subjects: No subjects. Narration: The overall environment sound is a faint, quiet hallway ambiance. The scene opens with a still shot of the closed apartment door. A hand enters the frame from the side, curls its fingers, and knocks firmly on the door three times <Audio>knocking sound three times</Audio>. After a brief pause, a distinct click is heard from the door's lock <Audio>sound of a lock clicking</Audio>, and then the door begins to swing inward, opened from the inside."
